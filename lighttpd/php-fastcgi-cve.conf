server.modules += ( "mod_fastcgi" )

fastcgi.server += ( ".php" =>
    ((
        "socket" => "/opt/php-7.4.cve/var/run/lighttpd/php-fastcgi.socket",
        "bin-path" => "/opt/php-7.4.cve/bin/php-cgi",
        "max-procs" => 1,
        "broken-scriptfilename" => "enable",
        "bin-environment" => (
            "PHP_FCGI_CHILDREN" => "4",
            "PHP_FCGI_MAX_REQUESTS" => "1000"
        )
    ))
)
